name: POS売上取込（ダイニー/新Uレジ）
on:
  schedule:
    - cron: '0 20 5 * *'   # 毎月6日 05:05 JST 目安（UTC 20:05 前日）。締め後に実行
  workflow_dispatch:
    inputs:
      month:
        description: '対象月 YYYY-MM（空なら先月）'
        required: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install
        run: |
          pip install playwright gspread google-auth pandas
          python -m playwright install --with-deps chromium
      - name: dinii
        env:
          DINII_LOGIN_URL: ${{ secrets.DINII_LOGIN_URL }}
          DINII_USER: ${{ secrets.DINII_USER }}
          DINII_PASS: ${{ secrets.DINII_PASS }}
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python dinii_sync.py "${{ github.event.inputs.month }}"
      - name: uleji
        env:
          ULEJI_LOGIN_URL: ${{ secrets.ULEJI_LOGIN_URL }}
          ULEJI_USER: ${{ secrets.ULEJI_USER }}
          ULEJI_PASS: ${{ secrets.ULEJI_PASS }}
          TARGET_SHEET_ID: ${{ secrets.TARGET_SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python uleji_sync.py "${{ github.event.inputs.month }}"
